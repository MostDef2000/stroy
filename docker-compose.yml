services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stoy
      POSTGRES_PASSWORD: stoy
      POSTGRES_DB: stoy
    ports:
      - "5432:5432"
    volumes:
      - stoy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - stoy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stoy
      MINIO_ROOT_PASSWORD: stoy-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stoy_minio:/data

volumes:
  stoy_postgres:
  stoy_redis:
  stoy_minio:

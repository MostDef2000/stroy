services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stroy
      POSTGRES_PASSWORD: stroy
      POSTGRES_DB: stroy
    ports:
      - "5432:5432"
    volumes:
      - stroy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - stroy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stroy
      MINIO_ROOT_PASSWORD: stroy-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stroy_minio:/data

volumes:
  stroy_postgres:
  stroy_redis:
  stroy_minio:

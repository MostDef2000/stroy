services:
  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STROY_ENV: production
      STROY_AUTO_CREATE_SCHEMA: "false"
      STROY_STORAGE_BACKEND: s3
      STROY_DATABASE_URL: postgresql+asyncpg://stroy:${POSTGRES_PASSWORD}@postgres:5432/stroy
      STROY_REDIS_URL: redis://redis:6379/0
      STROY_S3_ENDPOINT: http://minio:9000
      STROY_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      STROY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - edge
      - private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; h = (os.getenv('STROY_TRUSTED_HOSTS') or 'localhost').split(',')[0]; u.urlopen(u.Request('http://127.0.0.1:8000/health', headers={'Host': h}), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    command: ["stroy-worker"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - path: .worker-env
        required: false
    environment:
      STROY_ENV: production
      STROY_SERVER_URL: http://api:8000
      STROY_WORKER_EXECUTOR_MODE: fake
      STROY_WORKER_ID: stroy-vps-1
      STROY_WORKER_NAME: VPS CPU worker
      STROY_WORKER_CAPABILITIES: style_analysis,llm,blender_render,geometry_quality
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stroy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stroy
    volumes:
      - stroy_postgres:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroy"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 224M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - stroy_redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - stroy_minio:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
  private:
    internal: true

volumes:
  stroy_postgres:
  stroy_redis:
  stroy_minio:

name: deploy

# STROY Stage-3 production deploy (issue #130).
#
# Trust model (honest, validator-accepted):
#   * workflow_dispatch only; the gate job refuses any ref but refs/heads/main.
#   * Eligibility is bound to GITHUB_TOKEN reads of the Actions API plus a local
#     `git merge-base --is-ancestor` against origin/main. There is NO artifact
#     signing: anyone able to push to main (and thus produce a green ci.yml run)
#     is trusted. Single-owner repo => accepted.
#   * The owner must create the `production` environment (optionally with
#     required reviewers / wait timer) and set secrets DEPLOY_SSH_KEY,
#     DEPLOY_HOST, DEPLOY_USER and the repository variable DEPLOY_KNOWN_HOSTS.
#     This file cannot create any of them.
#   * No GHCR / packages:write: the API image travels as a tar in the envelope.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-hex commit SHA already merged to main"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_url: ${{ steps.select.outputs.run_url }}
    steps:
      - name: Require default branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::deploy must be dispatched from refs/heads/main (got ${GITHUB_REF})"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate SHA and ancestry
        id: validate
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/deploy_gate.py validate-sha "$SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Select trusted ci.yml run
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&status=completed&per_page=100" \
            -o "${RUNNER_TEMP}/runs.json"
          python3 scripts/deploy/deploy_gate.py select-run \
            "${RUNNER_TEMP}/runs.json" "$SHA" > "${RUNNER_TEMP}/selected.json"
          RUN_ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "${RUNNER_TEMP}/selected.json")"
          RUN_URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "${RUNNER_TEMP}/selected.json")"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify every ci.yml job succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          set -euo pipefail
          # per_page=100 covers ci.yml (5 jobs); verify_jobs fails closed on
          # truncated pagination or empty/error payloads.
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            -o "${RUNNER_TEMP}/jobs.json"
          python3 scripts/deploy/deploy_gate.py verify-jobs "${RUNNER_TEMP}/jobs.json"

  build:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      RUN_URL: ${{ needs.gate.outputs.run_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build API image
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/envelope"
          docker build -t "stroy-api:${SHA}" -f deploy/vps/Dockerfile.api .
          docker save "stroy-api:${SHA}" | gzip -9 > "${RUNNER_TEMP}/envelope/api-image.tar.gz"
          # Image identity is derived FROM THE SAVED ARCHIVE, not from docker
          # inspect: with the containerd image store (docker >= 27/29) inspect
          # reports the OCI manifest digest as .Id while the classic store
          # reports the config digest; only archive-derived values are
          # roundtrip-stable (issue #130 deploy run 1).  The wrapper accepts
          # either half of the archive identity pair.
          python3 scripts/deploy/bundle_utils.py image-ids \
            "${RUNNER_TEMP}/envelope/api-image.tar.gz" \
            | awk '$1 == "config" {print $2}' \
            > "${RUNNER_TEMP}/envelope/api_image_id.txt"
          test -s "${RUNNER_TEMP}/envelope/api_image_id.txt"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          # Lockfile is .gitignore'd; cache keying must use package.json
          # (which is tracked) or setup-node's cache step fails on a fresh run.
          cache-dependency-path: apps/web/package.json

      - name: Build web dist
        working-directory: apps/web
        run: |
          set -euo pipefail
          # NOTE: apps/web/package-lock.json is .gitignore'd, so `npm ci` would
          # fail on a fresh checkout (no lockfile). Deliberate choice: use
          # `npm install` (matches ci.yml), which resolves floating versions on
          # every deploy. Reproducibility requires committing a lockfile later
          # (out of scope for #130).
          npm install --no-audit --no-fund
          npm run build
          tar -C dist -czf "${RUNNER_TEMP}/envelope/web-dist.tar.gz" .

      - name: Bundle deploy config
        # deploy/vps contents at the archive root so the wrapper's
        # /opt/stroy-deploy/config/docker-compose.yml path resolves.
        run: |
          set -euo pipefail
          tar -C deploy/vps -czf "${RUNNER_TEMP}/envelope/deploy-config.tar.gz" .

      - name: Write manifest (digests recomputed here)
        run: |
          set -euo pipefail
          python3 scripts/deploy/bundle_utils.py build-manifest \
            "${RUNNER_TEMP}/envelope" "$SHA" \
            "$(cat "${RUNNER_TEMP}/envelope/api_image_id.txt")" "$RUN_ID" "$RUN_URL"

      - name: Verify manifest by rehashing members
        run: |
          python3 scripts/deploy/bundle_utils.py verify-manifest "${RUNNER_TEMP}/envelope"

      - name: Pack single envelope
        run: |
          set -euo pipefail
          tar -C "${RUNNER_TEMP}/envelope" -czf \
            "${RUNNER_TEMP}/deploy-envelope-${SHA}.tar.gz" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-envelope-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/deploy-envelope-${{ needs.gate.outputs.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error
          # Re-running the same dispatch must replace the prior artifact rather
          # than fail on a name collision.
          overwrite: true

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Owner-created environment; may carry required reviewers / wait timer.
    environment: production
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-envelope-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/envelope

      - name: Verify downloaded artifact against manifest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          python3 scripts/deploy/bundle_utils.py extract-safe \
            "${RUNNER_TEMP}/envelope/deploy-envelope-${SHA}.tar.gz" "${RUNNER_TEMP}/bundle"
          python3 scripts/deploy/bundle_utils.py verify-manifest "${RUNNER_TEMP}/bundle"
          python3 scripts/deploy/bundle_utils.py verify-web "${RUNNER_TEMP}/bundle/web-dist.tar.gz"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Host keys are pinned from a repo variable; ssh-keyscan is FORBIDDEN.
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Receive envelope on host
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "receive-v1 ${SHA}" \
            < "${RUNNER_TEMP}/envelope/deploy-envelope-${SHA}.tar.gz"

      - name: Apply release on host
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "apply-v1 ${SHA}"

      - name: Report host status to summary
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "status-v1" | tee -a "$GITHUB_STEP_SUMMARY"

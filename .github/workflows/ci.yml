name: ci

on:
  push:
  pull_request:

jobs:
  contracts-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: python scripts/check_json.py

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate model profiles
        run: python scripts/validate_model_profiles.py

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Test Alembic migration
        env:
          STROY_DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: apps/web
        run: npm install

      - name: Audit dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Build
        working-directory: apps/web
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate VPS Compose
        run: |
          cp deploy/vps/env.example deploy/vps/.env
          docker compose \
            --env-file deploy/vps/.env \
            -f deploy/vps/docker-compose.yml \
            config --quiet


  blender-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install STROY
        run: python -m pip install -e .

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Render golden room headlessly
        env:
          STROY_BLENDER_SAMPLES: "1"
        run: >
          python scripts/render_golden_room.py
          --resolution-scale 0.05
          --output-dir renders/ci-golden

      - name: Verify render artifacts
        run: |
          test -s renders/ci-golden/scene_metadata.json
          test -s renders/ci-golden/rgb.png
          test -s renders/ci-golden/depth.exr
          test -s renders/ci-golden/normals.exr
          test -s renders/ci-golden/object_ids.exr
          test -s renders/ci-golden/material_ids.exr

      - name: Verify pixel-aligned pass dimensions
        run: >
          blender --background --factory-startup
          --python blender/verify_render_outputs.py
          --
          --output-dir renders/ci-golden

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `gitleaks detect` (git mode) can scan for secrets
          # that were introduced AND later removed (SECURITY-STAGE stage 3).
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets (gitleaks, git history)
        run: gitleaks detect --redact -v --source .

      - name: Scan workspace for secrets (gitleaks, filesystem)
        run: gitleaks detect --no-git --redact -v --source .

      - name: Canary - verify gitleaks detection is working
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d)"
          trap 'rm -rf "$canary_dir"' EXIT
          # Static, non-functional canary (NOT a real credential), split into
          # short fragments so this workflow file is not flagged by the scans
          # above. The canary file exists only inside this step's temp dir.
          printf 'api_key = "[redacted:generic-assignment]"\n' 'rIszjgJH' 'bfhTsIsV' '4CPALT2y' 'o4a4jxzx' > "$canary_dir/canary.env"
          set +e
          gitleaks detect --no-git --redact -v --source "$canary_dir" \
            > "$canary_dir/report.txt" 2>&1
          status=$?
          set -e
          # gitleaks contract: 0 = no leaks, 1 = leaks found, >1 = scanner error.
          # A non-zero exit alone would also accept scanner failures, so require
          # exactly the leaks-found exit AND a finding for the canary file.
          if [ "$status" -ne 1 ]; then
            cat "$canary_dir/report.txt"
            echo "::error::Canary expected gitleaks exit 1 (leaks found), got $status"
            exit 1
          fi
          if ! grep -q "canary.env" "$canary_dir/report.txt"; then
            cat "$canary_dir/report.txt"
            echo "::error::Gitleaks exited 1 but reported no finding for canary.env"
            exit 1
          fi
          echo "Canary secret detected as expected (exit 1, finding present)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and pip-audit
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Audit Python dependencies (pip-audit)
        run: |
          # PYSEC-2026-1845 / CVE-2025-71176 / GHSA-6w46-j5rx-g56g (pytest < 9.0.3)
          # is MEDIUM severity, dev/test environment only. The fixed pytest>=9.0.3
          # is NOT installable: every published pytest-asyncio (<1) pins pytest<9,
          # so pip resolution fails (CI run 37271858906, ResolutionImpossible).
          # Suppressed as a documented accepted risk; revisit when
          # pytest-asyncio ships a pytest-9-compatible release.
          # Coverage note (governed, per issue #124): --strict is NOT usable in
          # any configuration here - pip-audit 2.10.1 aborts on the private
          # project package (stroy is never on PyPI), editable or not. With
          # --skip-editable the ONLY excluded package is the project itself;
          # any transitive dep that fails metadata collection is reported as a
          # warning without failing the job. Accepted residual risk, revisit on
          # the next pip-audit major upgrade.
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-1845

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
